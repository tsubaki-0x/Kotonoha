import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def engineRoot = rootProject.projectDir.parentFile
// Use the SDL checkout already pinned by the Kotonoha repository.  The old
// Gradle path cloned a second SDL tree under Android/.deps, which could drift
// from the native engine submodule and also made offline Android builds fail.
def sdlRoot = new File(engineRoot, 'lib/submodules/SDL')
def vcpkgRoot = providers.environmentVariable('VCPKG_ROOT').orNull
if (!vcpkgRoot) {
    throw new GradleException('Set VCPKG_ROOT to your vcpkg checkout before opening Android.')
}
def includeGameAssets = providers.gradleProperty('bundleGameAssets').orElse('true').get().toBoolean()
def abis = providers.gradleProperty('abis').orElse('arm64-v8a').get().split(',').toList()
if (abis.size() != 1 || !(abis[0] in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException('Android builds must select exactly one supported ABI: -Pabis=arm64-v8a or -Pabis=x86_64.')
}
def vcpkgTriplet = abis[0] == 'arm64-v8a' ? 'arm64-android' : 'x64-android'
def games = [
    example: ['example', 'Kotonoha', 'me.kotonoha.example', 'Kotonoha'],
    zeroNoTsukaima: ['zero-no-tsukaima', 'ZeroNoTsukaima', 'me.hirameki.kotonoha.zeronotsukaima', 'Zero no Tsukaima'],
    snowRadish: ['snow-radish-vacation', 'SnowRadish', 'me.hirameki.kotonoha.snowradishvacation', 'Snow Radish Vacation!!'],
    dokiDoki: ['doki-doki-literature-club', 'DokiDoki', 'me.hirameki.kotonoha.dokidokiliteratureclub', 'Doki Doki Literature Club!'],
    schoolDays: ['school-days', 'SchoolDays', 'me.hirameki.kotonoha.schooldays', 'School Days']
]

android {
    namespace 'org.kotonoha.android'
    compileSdk = 37
    compileSdkMinor = 0
    buildToolsVersion '37.0.0'
    // Keep the Android build pinned to the NDK installed in this workstation.
    // r27 supports the explicit 16 KiB max-page-size linker contract below and
    // is the toolchain used by the existing Kotonoha/School Days Android work.
    ndkVersion '27.0.12077973'
    defaultConfig {
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // Every game compiles the shared launcher Java sources; only the
        // explicit School Days dist build overrides this field to true.
        buildConfigField 'boolean', 'DISTRIBUTION_BUILD', 'false'
        ndk { abiFilters.addAll(abis) }
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                          "-DVCPKG_MANIFEST_DIR=${engineRoot}",
                          "-DVCPKG_OVERLAY_PORTS=${new File(engineRoot, 'vcpkg-overlays')}",
                          "-DVCPKG_TARGET_TRIPLET=${vcpkgTriplet}",
                          "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
                          "-DKOTONOHA_SDL_SOURCE_DIR=${sdlRoot}",
                          '-DANDROID_PLATFORM=android-28',
                          '-DANDROID_STL=c++_shared'
            }
        }
    }
    flavorDimensions += 'game'
    productFlavors {
        games.each { flavor, game ->
            create(flavor) {
                dimension 'game'
                applicationId game[2]
                manifestPlaceholders.appName = game[3]
                buildConfigField 'String', 'NATIVE_TARGET', "\"${game[1]}\""
                externalNativeBuild {
                    cmake {
                        arguments "-DKOTONOHA_ANDROID_GAME=${game[0]}",
                                "-DKOTONOHA_VCPKG_BASE_DIR=${rootProject.projectDir}/build/vcpkg${flavor == 'dokiDoki' ? '-python' : ''}"
                        targets game[1]
                    }
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro',
                    file("${sdlRoot}/android-project/app/proguard-rules.pro")
        }
        // The School Days distribution is a dedicated, non-debuggable build,
        // NOT the old schoolDaysDebug APK renamed to dist. CMake also excludes
        // DebugOverlay/MCP/QA code, instead of merely hiding the controls.
        dist {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'DISTRIBUTION_BUILD', 'true'
            externalNativeBuild {
                cmake {
                    arguments '-DKOTONOHA_DISTRIBUTION_BUILD=ON',
                              '-DKOTONOHA_DEV_CONTROL=OFF'
                }
            }
        }
        // Separate package/Android data root: development saves must never be
        // re-used by the commercial installation on the same device.
        dev {
            initWith debug
            matchingFallbacks = ['debug']
            applicationIdSuffix '.dev'
            buildConfigField 'boolean', 'DISTRIBUTION_BUILD', 'false'
            externalNativeBuild {
                cmake {
                    arguments '-DKOTONOHA_DISTRIBUTION_BUILD=OFF',
                              '-DKOTONOHA_DEV_CONTROL=OFF'
                }
            }
        }
    }
    // Preserve the established debug/release variants of every other game.
    // For School Days, only the explicit commercial/dev editions are valid.
    variantFilter { variant ->
        boolean schoolDaysVariant = variant.flavors.any { it.name == 'schoolDays' }
        if (schoolDaysVariant && !(variant.buildType.name in ['dist', 'dev'])) {
            variant.setIgnore(true)
        } else if (!schoolDaysVariant && (variant.buildType.name in ['dist', 'dev'])) {
            variant.setIgnore(true)
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }
    sourceSets {
        main {
            java.srcDirs += new File(sdlRoot, 'android-project/app/src/main/java')
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}

android.applicationVariants.all { variant ->
    def game = games[variant.flavorName]
    def taskSuffix = variant.name.capitalize()
    def staged = layout.buildDirectory.dir("generated/assets/${variant.name}")
    def gameAssets = new File(engineRoot, "games/${game[0]}/game-assets")
    def includeThisGame = includeGameAssets || variant.flavorName == 'example'
    def assets = tasks.register("stage${taskSuffix}Assets", Sync) {
        from(new File(engineRoot, 'assets')) { into 'assets' }
        if (variant.flavorName == 'schoolDays') {
            // Android School Days always needs its engine-owned routing and
            // subtitle style. Never bundle original retail GPKs or arbitrary
            // files from a developer's local game-assets directory into APKs.
            from(gameAssets) {
                include 'school-days-hq.ktnroute', 'styles.ass'
                into 'game-assets'
            }
            from(new File(engineRoot, 'games/school-days/launcher-art')) {
                include 'SchoolDaysHQ-Launcher.png'
                into 'launcher-art'
            }
        } else if (includeThisGame) {
            from(gameAssets) { into 'game-assets' }
        }
        into staged
        doFirst {
            if ((includeThisGame || variant.flavorName == 'schoolDays') &&
                    !gameAssets.isDirectory()) {
                throw new GradleException("Game asset source directory is missing: ${gameAssets}")
            }
            if (variant.flavorName == 'schoolDays' &&
                    (!new File(gameAssets, 'school-days-hq.ktnroute').isFile() ||
                     !new File(gameAssets, 'styles.ass').isFile())) {
                throw new GradleException('School Days route/styles are required for the APK')
            }
            if (variant.flavorName == 'schoolDays' &&
                    !new File(engineRoot,
                            'games/school-days/launcher-art/SchoolDaysHQ-Launcher.png').isFile()) {
                throw new GradleException('School Days Android launcher artwork is missing')
            }
        }
        doLast {
            new File(staged.get().asFile, 'game-assets').mkdirs()
            if (variant.flavorName == 'dokiDoki') {
                def foundStdlib = false
                abis.each { abi ->
                    def triplet = abi == 'arm64-v8a' ? 'arm64-android' : (abi == 'x86_64' ? 'x64-android' : null)
                    if (triplet != null) {
                        def prefix = new File(rootProject.projectDir, "build/vcpkg-python/${abi}/${triplet}")
                        def libraryRoot = new File(prefix, variant.buildType.name == 'debug' ? 'debug/lib' : 'lib')
                        def stdlibs = fileTree(libraryRoot).matching { include 'python3.*/**' }.files
                        if (!stdlibs.empty) {
                            foundStdlib = true
                            copy {
                                from libraryRoot
                                include 'python3.*/**'
                                into new File(staged.get().asFile, 'python/lib')
                            }
                        }
                    }
                }
                if (!foundStdlib) {
                    throw new GradleException('Android CPython standard library is missing for the selected ABIs.')
                }
            }
            def digest = MessageDigest.getInstance('SHA-256')
            fileTree(staged).files.sort { it.path }.each { file ->
                digest.update(file.toPath().toString().replace(staged.get().asFile.path, '').getBytes('UTF-8'))
                file.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
            }
            new File(staged.get().asFile, 'packaged-assets.sha256').text = digest.digest().encodeHex().toString() + '\n'
        }
    }
    variant.mergeAssetsProvider.configure {
        dependsOn assets
        inputs.dir staged
    }
    // Release lint also examines merged assets. Gradle 8.14 rejects reading a
    // generated directory from stage*Assets without an explicit task edge.
    tasks.matching {
        it.name.toLowerCase(Locale.ROOT).contains(variant.name.toLowerCase(Locale.ROOT)) &&
                it.name.toLowerCase(Locale.ROOT).contains('lint')
    }.configureEach { dependsOn assets }
    android.sourceSets[variant.name].assets.srcDir staged
    if (variant.flavorName == 'dokiDoki') {
        assets.configure {
            dependsOn variant.externalNativeBuildProviders
        }
    }
}
