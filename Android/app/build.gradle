import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def engineRoot = rootProject.projectDir.parentFile
// Use the SDL checkout already pinned by the Kotonoha repository.  The old
// Gradle path cloned a second SDL tree under Android/.deps, which could drift
// from the native engine submodule and also made offline Android builds fail.
def sdlRoot = new File(engineRoot, 'lib/submodules/SDL')
def vcpkgRoot = providers.environmentVariable('VCPKG_ROOT').orNull
if (!vcpkgRoot) {
    throw new GradleException('Set VCPKG_ROOT to your vcpkg checkout before opening Android.')
}
def includeGameAssets = providers.gradleProperty('bundleGameAssets').orElse('true').get().toBoolean()
// User-owned GPK/JSON translations are never committed in this repository.
// School Days builds require an explicit external source directory.
def schoolDaysTranslationsDir = providers.gradleProperty('schoolDaysTranslationsDir').orNull
// Only the DEV variant may receive user-supplied, read-only LxH test saves.
// No checked-in fixtures, and no implicitly selected PC saves directory.
def schoolDaysDevSavesDir = providers.gradleProperty('schoolDaysDevSavesDir').orNull
// SHA-256 of the eight user-authorized LxH QA saves, audited as SLog/FlgH
// with their expected seven routes. Never package a different Save folder
// under the same names (which could mix scenes or foreign user data).
def schoolDaysDevExpectedSaveHashes = [
        'GlobalFlag.DAT': 'd88a3a057415c1b8b5dbdb63b5c05e485181301eab3cb583666bc2516ad1f6d0',
        'SaveFile000.DAT': 'cbbe3787ca7a976a323be887f7825b91ae8d961a56bc6564d98b407ad64129cd',
        'SaveFile001.DAT': 'ae5e1f57e2e1fbd1452aa67cc0c70294d5023dcc5d2ca271cd2b8c046188bb1d',
        'SaveFile002.DAT': 'b5d931b33c8347989ef6de08ea549ec94537beacbda0354f5ed2e90761719357',
        'SaveFile003.DAT': '2c415fba8703af68933b906b9fdaf2af07a95cb92db48224a8c22970baa6404c',
        'SaveFile004.DAT': 'c90870be5c270e05bfd44808449e19bafb1d7c64d9f71d649e4411d630f51507',
        'SaveFile005.DAT': '67e4ba94729086805a8c2467045fdb1ca8b7c31035e1e8ae5a548180a77657e6',
        'SaveFile006.DAT': '8a604b43819a51d281be3c08a3dd51ee13dba2b8b709f35e81c49bfdd3d10af6'
]
def abis = providers.gradleProperty('abis').orElse('arm64-v8a').get().split(',').toList()
if (abis.size() != 1 || !(abis[0] in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException('Android builds must select exactly one supported ABI: -Pabis=arm64-v8a or -Pabis=x86_64.')
}
def vcpkgTriplet = abis[0] == 'arm64-v8a' ? 'arm64-android' : 'x64-android'
def games = [
    example: ['example', 'Kotonoha', 'me.kotonoha.example', 'Kotonoha'],
    zeroNoTsukaima: ['zero-no-tsukaima', 'ZeroNoTsukaima', 'me.hirameki.kotonoha.zeronotsukaima', 'Zero no Tsukaima'],
    snowRadish: ['snow-radish-vacation', 'SnowRadish', 'me.hirameki.kotonoha.snowradishvacation', 'Snow Radish Vacation!!'],
    dokiDoki: ['doki-doki-literature-club', 'DokiDoki', 'me.hirameki.kotonoha.dokidokiliteratureclub', 'Doki Doki Literature Club!'],
    schoolDays: ['school-days', 'SchoolDays', 'me.hirameki.kotonoha.schooldays', 'School Days']
]

android {
    namespace 'org.kotonoha.android'
    compileSdk = 37
    compileSdkMinor = 0
    buildToolsVersion '37.0.0'
    // Keep the Android build pinned to the NDK installed in this workstation.
    // r27 supports the explicit 16 KiB max-page-size linker contract below and
    // is the toolchain used by the existing Kotonoha/School Days Android work.
    ndkVersion '27.0.12077973'
    defaultConfig {
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // Every game compiles the shared launcher Java sources; only the
        // explicit School Days dist build overrides this field to true.
        buildConfigField 'boolean', 'DISTRIBUTION_BUILD', 'false'
        ndk { abiFilters.addAll(abis) }
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                          "-DVCPKG_MANIFEST_DIR=${engineRoot}",
                          "-DVCPKG_OVERLAY_PORTS=${new File(engineRoot, 'vcpkg-overlays')}",
                          "-DVCPKG_TARGET_TRIPLET=${vcpkgTriplet}",
                          "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
                          "-DKOTONOHA_SDL_SOURCE_DIR=${sdlRoot}",
                          '-DANDROID_PLATFORM=android-28',
                          '-DANDROID_STL=c++_shared'
            }
        }
    }
    flavorDimensions += 'game'
    productFlavors {
        games.each { flavor, game ->
            create(flavor) {
                dimension 'game'
                applicationId game[2]
                manifestPlaceholders.appName = game[3]
                buildConfigField 'String', 'NATIVE_TARGET', "\"${game[1]}\""
                externalNativeBuild {
                    cmake {
                        arguments "-DKOTONOHA_ANDROID_GAME=${game[0]}",
                                "-DKOTONOHA_VCPKG_BASE_DIR=${rootProject.projectDir}/build/vcpkg${flavor == 'dokiDoki' ? '-python' : ''}"
                        targets game[1]
                    }
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro',
                    file("${sdlRoot}/android-project/app/proguard-rules.pro")
        }
        // The School Days distribution is a dedicated, non-debuggable build,
        // NOT the old schoolDaysDebug APK renamed to dist. CMake also excludes
        // DebugOverlay/MCP/QA code, instead of merely hiding the controls.
        dist {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'DISTRIBUTION_BUILD', 'true'
            externalNativeBuild {
                cmake {
                    arguments '-DKOTONOHA_DISTRIBUTION_BUILD=ON',
                              '-DKOTONOHA_DEV_CONTROL=OFF'
                }
            }
        }
        // Installable commercial-feature smoke test, never a production
        // release. Use the local Android debug signing identity, but retain
        // the exact native distribution flags and remove DEV source code.
        // A distinct application ID isolates its data and allows a later
        // genuinely release-signed commercial app to install independently.
        distTest {
            initWith dist
            matchingFallbacks = ['release']
            applicationIdSuffix '.test'
            versionNameSuffix '-install-test'
            signingConfig signingConfigs.debug
            buildConfigField 'boolean', 'DISTRIBUTION_BUILD', 'true'
        }
        // Separate package/Android data root: development saves must never be
        // re-used by the commercial installation on the same device.
        dev {
            initWith debug
            matchingFallbacks = ['debug']
            applicationIdSuffix '.dev'
            buildConfigField 'boolean', 'DISTRIBUTION_BUILD', 'false'
            externalNativeBuild {
                cmake {
                    arguments '-DKOTONOHA_DISTRIBUTION_BUILD=OFF',
                              '-DKOTONOHA_DEV_CONTROL=OFF'
                }
            }
        }
    }
    // Preserve the established debug/release variants of every other game.
    // For School Days, only the explicit commercial/dev editions are valid.
    variantFilter { variant ->
        boolean schoolDaysVariant = variant.flavors.any { it.name == 'schoolDays' }
        if (schoolDaysVariant && !(variant.buildType.name in ['dist', 'distTest', 'dev'])) {
            variant.setIgnore(true)
        } else if (!schoolDaysVariant && (variant.buildType.name in ['dist', 'distTest', 'dev'])) {
            variant.setIgnore(true)
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }
    sourceSets {
        main {
            java.srcDirs += new File(sdlRoot, 'android-project/app/src/main/java')
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}

android.applicationVariants.all { variant ->
    def game = games[variant.flavorName]
    def taskSuffix = variant.name.capitalize()
    def staged = layout.buildDirectory.dir("generated/assets/${variant.name}")
    def gameAssets = new File(engineRoot, "games/${game[0]}/game-assets")
    def includeThisGame = includeGameAssets || variant.flavorName == 'example'
    def assets = tasks.register("stage${taskSuffix}Assets", Sync) {
        from(new File(engineRoot, 'assets')) { into 'assets' }
        if (variant.flavorName == 'schoolDays') {
            // Android School Days always needs its engine-owned routing and
            // subtitle style. Never bundle original retail GPKs or arbitrary
            // files from a developer's local game-assets directory into APKs.
            from(gameAssets) {
                include 'school-days-hq.ktnroute', 'styles.ass'
                into 'game-assets'
            }
            from(new File(engineRoot, 'games/school-days/launcher-art')) {
                include 'SchoolDaysHQ-Launcher.png'
                into 'launcher-art'
            }
            // Only translated language GPKs are eligible; original HQ Packs
            // must NEVER be copied from either a player's install or Downloads.
            // A missing external translation source is a build error.
            if (schoolDaysTranslationsDir) {
                from(new File(schoolDaysTranslationsDir)) {
                    include 'jsons/*.json'
                    include 'scripts/en-lxh.GPK',
                            'scripts/pt-BR-lxh.GPK',
                            'scripts/es-lxh.GPK',
                            'scripts/zh-CN-lxh.GPK',
                            'scripts/Script - Brazilian.GPK',
                            'scripts/Script - Spanish.GPK',
                            'scripts/Script - chinese-compatible.GPK'
                    into 'translations'
                }
            }
            if (variant.name == 'schoolDaysDev' && schoolDaysDevSavesDir) {
                from(new File(schoolDaysDevSavesDir)) {
                    include 'SaveFile000.DAT', 'SaveFile001.DAT',
                            'SaveFile002.DAT', 'SaveFile003.DAT',
                            'SaveFile004.DAT', 'SaveFile005.DAT',
                            'SaveFile006.DAT', 'GlobalFlag.DAT'
                    into 'dev-save-fixtures/Save'
                }
            }
        } else if (includeThisGame) {
            from(gameAssets) { into 'game-assets' }
        }
        into staged
        doFirst {
            if ((includeThisGame || variant.flavorName == 'schoolDays') &&
                    !gameAssets.isDirectory()) {
                throw new GradleException("Game asset source directory is missing: ${gameAssets}")
            }
            if (variant.flavorName == 'schoolDays' &&
                    (!new File(gameAssets, 'school-days-hq.ktnroute').isFile() ||
                     !new File(gameAssets, 'styles.ass').isFile())) {
                throw new GradleException('School Days route/styles are required for the APK')
            }
            if (variant.flavorName == 'schoolDays' &&
                    !new File(engineRoot,
                            'games/school-days/launcher-art/SchoolDaysHQ-Launcher.png').isFile()) {
                throw new GradleException('School Days Android launcher artwork is missing')
            }
            if (variant.flavorName == 'schoolDays') {
                if (!schoolDaysTranslationsDir)
                    throw new GradleException('Missing -PschoolDaysTranslationsDir=...: provide an external folder with translations/jsons and translations/scripts. No translation files are stored in Git.')
                def source = new File(schoolDaysTranslationsDir)
                def essential = ['scripts/en-lxh.GPK',
                        'scripts/Script - Brazilian.GPK', 'scripts/pt-BR-lxh.GPK',
                        'scripts/Script - Spanish.GPK', 'scripts/es-lxh.GPK',
                        'jsons/en-lxh.json', 'jsons/es.json', 'jsons/es-lxh.json']
                if (!source.isDirectory() ||
                        essential.any { !new File(source, it).isFile() ||
                                new File(source, it).length() == 0 }) {
                    throw new GradleException('School Days external language source is missing or incomplete: ' + source +
                            ' (required EN/PT-BR/ES GPK and EN/ES JSON/LxH files). Original contents are never modified.')
                }
            }
            if (variant.name == 'schoolDaysDev') {
                if (!schoolDaysDevSavesDir)
                    throw new GradleException('Missing -PschoolDaysDevSavesDir=...: DEV requires an external Save folder containing 7 LxH SaveFiles and GlobalFlag.DAT. These files must not be checked into Git.')
                def directory = new File(schoolDaysDevSavesDir)
                def expectedSaves = (0..6).collect { String.format('SaveFile%03d.DAT', it) } + ['GlobalFlag.DAT']
                if (!directory.isDirectory() ||
                        expectedSaves.any { !new File(directory, it).isFile() ||
                                new File(directory, it).length() == 0 }) {
                    throw new GradleException('Missing or empty School Days DEV LxH save fixtures in ' +
                            directory + '; original data was not modified.')
                }
                // Names/non-empty files are insufficient. Pin the audited
                // content before staging; no originals are opened for write.
                expectedSaves.each { name ->
                    def sha = MessageDigest.getInstance('SHA-256')
                    new File(directory, name).withInputStream { input ->
                        byte[] buffer = new byte[65536]
                        int read
                        while ((read = input.read(buffer)) != -1)
                            sha.update(buffer, 0, read)
                    }
                    if (sha.digest().encodeHex().toString() !=
                            schoolDaysDevExpectedSaveHashes[name])
                        throw new GradleException('Unrecognized LxH DEV save fixture: ' + name +
                                ' (SHA-256 differs from the audited source; source untouched)')
                }
            }
        }
        doLast {
            new File(staged.get().asFile, 'game-assets').mkdirs()
            if (variant.flavorName == 'schoolDays') {
                // Verified per-file SHA256 makes updates possible without
                // replacing user-owned PT-BR or previously imported content.
                def folder = new File(staged.get().asFile, 'translations')
                def translated = fileTree(folder).files.sort { a, b -> a.path <=> b.path }
                if (translated.empty)
                    throw new GradleException('No packaged translations for School Days')
                def lines = ['SchoolDaysEmbeddedTranslations.v1']
                translated.each { source ->
                    def relative = folder.toPath().relativize(source.toPath()).toString().replace('\\', '/')
                    if (!(relative ==~ /jsons\/[A-Za-z0-9][A-Za-z0-9_-]{0,70}\.json/) &&
                            !(relative in [
                                    'scripts/en-lxh.GPK', 'scripts/pt-BR-lxh.GPK',
                                    'scripts/es-lxh.GPK', 'scripts/zh-CN-lxh.GPK',
                                    'scripts/Script - Brazilian.GPK',
                                    'scripts/Script - Spanish.GPK',
                                    'scripts/Script - chinese-compatible.GPK'])) {
                        throw new GradleException('Unexpected packaged translation: ' + relative)
                    }
                    def sha = MessageDigest.getInstance('SHA-256')
                    source.withInputStream { stream ->
                        byte[] bytes = new byte[65536]
                        int read
                        while ((read = stream.read(bytes)) != -1) sha.update(bytes, 0, read)
                    }
                    lines.add(relative + '\t' + sha.digest().encodeHex().toString())
                }
                new File(staged.get().asFile, 'translations-manifest.sha256').text =
                        lines.join('\n') + '\n'
            }
            if (variant.name == 'schoolDaysDev') {
                def folder = new File(staged.get().asFile, 'dev-save-fixtures/Save')
                def expectedSaves = (0..6).collect { String.format('SaveFile%03d.DAT', it) } + ['GlobalFlag.DAT']
                def actual = fileTree(folder).files.sort { it.name }
                if (actual.size() != expectedSaves.size() ||
                        actual.any { !(it.name in expectedSaves) })
                    throw new GradleException('DEV save fixture staging mismatch; refusing an incomplete APK')
                def lines = ['SchoolDaysDevSaveFixtures.v1']
                actual.each { save ->
                    def sha = MessageDigest.getInstance('SHA-256')
                    save.withInputStream { input ->
                        byte[] buffer = new byte[65536]
                        int read
                        while ((read = input.read(buffer)) != -1)
                            sha.update(buffer, 0, read)
                    }
                    def digest = sha.digest().encodeHex().toString()
                    if (digest != schoolDaysDevExpectedSaveHashes[save.name])
                        throw new GradleException('Staged DEV save fixture changed: ' + save.name)
                    lines.add(save.name + '\t' + digest +
                            '\t' + save.length())
                }
                new File(staged.get().asFile, 'dev-save-fixtures-manifest.sha256').text =
                        lines.join('\n') + '\n'
            }
            if (variant.flavorName == 'dokiDoki') {
                def foundStdlib = false
                abis.each { abi ->
                    def triplet = abi == 'arm64-v8a' ? 'arm64-android' : (abi == 'x86_64' ? 'x64-android' : null)
                    if (triplet != null) {
                        def prefix = new File(rootProject.projectDir, "build/vcpkg-python/${abi}/${triplet}")
                        def libraryRoot = new File(prefix, variant.buildType.name == 'debug' ? 'debug/lib' : 'lib')
                        def stdlibs = fileTree(libraryRoot).matching { include 'python3.*/**' }.files
                        if (!stdlibs.empty) {
                            foundStdlib = true
                            copy {
                                from libraryRoot
                                include 'python3.*/**'
                                into new File(staged.get().asFile, 'python/lib')
                            }
                        }
                    }
                }
                if (!foundStdlib) {
                    throw new GradleException('Android CPython standard library is missing for the selected ABIs.')
                }
            }
            def digest = MessageDigest.getInstance('SHA-256')
            fileTree(staged).files.sort { it.path }.each { file ->
                digest.update(file.toPath().toString().replace(staged.get().asFile.path, '').getBytes('UTF-8'))
                file.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
            }
            new File(staged.get().asFile, 'packaged-assets.sha256').text = digest.digest().encodeHex().toString() + '\n'
        }
    }
    variant.mergeAssetsProvider.configure {
        dependsOn assets
        inputs.dir staged
    }
    // Release lint also examines merged assets. Gradle 8.14 rejects reading a
    // generated directory from stage*Assets without an explicit task edge.
    tasks.matching {
        it.name.toLowerCase(Locale.ROOT).contains(variant.name.toLowerCase(Locale.ROOT)) &&
                it.name.toLowerCase(Locale.ROOT).contains('lint')
    }.configureEach { dependsOn assets }
    android.sourceSets[variant.name].assets.srcDir staged
    if (variant.flavorName == 'dokiDoki') {
        assets.configure {
            dependsOn variant.externalNativeBuildProviders
        }
    }
}
